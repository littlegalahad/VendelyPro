</div>

<h1 class="text-headline-lg-mobile font-headline-lg-mobile md:text-headline-lg md:font-headline-lg text-on-background">
                Vende por WhatsApp en segundos

<!-- Interactive micro-interactions script -->
<script>
        document.addEventListener('DOMContentLoaded', () => {
            const nextBtn = document.querySelector('button.bg-primary');
            const skipBtn = document.querySelector('button.text-on-surface-variant');

            nextBtn.addEventListener('mouseenter', () => {
                nextBtn.querySelector('span.material-symbols-outlined').style.transform = 'translateX(4px)';
                nextBtn.querySelector('span.material-symbols-outlined').style.transition = 'transform 0.3s ease';
            });

            nextBtn.addEventListener('mouseleave', () => {
                nextBtn.querySelector('span.material-symbols-outlined').style.transform = 'translateX(0px)';
            });

            // Page transition simulation
            nextBtn.addEventListener('click', () => {
                document.body.style.opacity = '0.5';
                document.body.style.transition = 'opacity 0.5s ease';
                setTimeout(() => {
                    document.body.style.opacity = '1';
                }, 500);
            });
        });
    </script>
