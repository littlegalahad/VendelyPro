            </button>

<!-- Interactive Background Particles (Atmospheric micro-interaction) -->
<div class="fixed inset-0 pointer-events-none -z-10 opacity-30" id="particle-container"></div>
<script>
        // Micro-interaction: Subtle floating particles in the background
        const container = document.getElementById('particle-container');
        const particleCount = 15;

        for (let i = 0; i < particleCount; i++) {
            const particle = document.createElement('div');
            const size = Math.random() * 200 + 50;
            particle.className = 'absolute bg-primary-fixed rounded-full blur-[80px] opacity-20';
            particle.style.width = `${size}px`;
            particle.style.height = `${size}px`;
            particle.style.left = `${Math.random() * 100}%`;
            particle.style.top = `${Math.random() * 100}%`;
            
            // Random movement
            const duration = Math.random() * 20 + 10;
            particle.style.transition = `all ${duration}s linear`;
            
            container.appendChild(particle);

            function moveParticle() {
                particle.style.left = `${Math.random() * 100}%`;
                particle.style.top = `${Math.random() * 100}%`;
            }

            setInterval(moveParticle, duration * 1000);
            // Initial move
            setTimeout(moveParticle, 100);
        }

        // Button interaction effect
        document.querySelectorAll('button').forEach(btn => {
            btn.addEventListener('mousedown', () => {
                btn.style.transform = 'scale(0.96)';
            });
            btn.addEventListener('mouseup', () => {
                btn.style.transform = '';
            });
        });
    </script>
